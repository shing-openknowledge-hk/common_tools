			safeDecodeURIComponent(str) {
			  // Handle non-string inputs
			  if (typeof str !== 'string') {
				return str;
			  }
			  
			  try {
				return decodeURIComponent(str); // Try native decoding first
			  } catch {
				// Fallback: decode manually using UTF-8
				const bytes = [];
				let result = '';
				let lastIndex = 0;
				
				// Use a regex to find all percent-encoded sequences
				const regex = /%([0-9A-Fa-f]{2})/g;
				let match;
				
				while ((match = regex.exec(str)) !== null) {
				  // Add any plain text before this match
				  if (match.index > lastIndex) {
					result += str.substring(lastIndex, match.index);
				  }
				  
				  // Add the decoded byte
				  bytes.push(parseInt(match[1], 16));
				  lastIndex = match.index + 3;
				  
				  // If we have a complete UTF-8 sequence or reached the end, decode it
				  if (bytes.length > 0 && (match.index + 3 >= str.length || !str[match.index + 3].startsWith('%'))) {
					try {
					  const decoder = new TextDecoder('utf-8');
					  result += decoder.decode(new Uint8Array(bytes));
					  bytes.length = 0; // Reset for next sequence
					} catch {
					  // If UTF-8 decoding fails, keep the original percent-encoded sequence
					  result += str.substring(match.index - (bytes.length - 1) * 3, match.index + 3);
					  bytes.length = 0;
					}
				  }
				}
				
				// Add any remaining plain text after the last match
				if (lastIndex < str.length) {
				  result += str.substring(lastIndex);
				}
				
				// Handle any remaining bytes that weren't processed
				if (bytes.length > 0) {
				  try {
					const decoder = new TextDecoder('utf-8');
					result += decoder.decode(new Uint8Array(bytes));
				  } catch {
					// Reconstruct the original percent-encoded sequences for invalid bytes
					for (let i = 0; i < bytes.length; i++) {
					  result += '%' + bytes[i].toString(16).padStart(2, '0').toUpperCase();
					}
				  }
				}
				
				return result;
			  }
			}

			extract(txt)

						url:txt
					}
				} else {

						title:txt.substr(0, pos),
						url:txt.substr(pos+1)
					}
				}
			}

			processDataTransferItemList(itemList)

			itemListToArray(itemList)
			{
				var array = [];
				for(var i = 0;i <itemList.length;i++)
				{
					var item = itemList[i];
					array.push(item);
				}
				return array;
			}
			getYoutubeID(url, opts) {
				if (opts == undefined) {
				  opts = {fuzzy: true};
				}

				if (/youtu\.?be/.test(url)) {

				  // Look first for known patterns
				  var i;
				  var patterns = [
					/youtu\.be\/([^#\&\?]{11})/,  // youtu.be/<id>
					/\?v=([^#\&\?]{11})/,         // ?v=<id>
					/\&v=([^#\&\?]{11})/,         // &v=<id>
					/embed\/([^#\&\?]{11})/,      // embed/<id>
					/\/v\/([^#\&\?]{11})/         // /v/<id>
				  ];

				  // If any pattern matches, return the ID
				  for (i = 0; i < patterns.length; ++i) {
					if (patterns[i].test(url)) {
					  return patterns[i].exec(url)[1];
					}
				  }

				  if (opts.fuzzy) {
					// If that fails, break it apart by certain characters and look 
					// for the 11 character key
					var tokens = url.split(/[\/\&\?=#\.\s]/g);
					for (i = 0; i < tokens.length; ++i) {
					  if (/^[^#\&\?]{11}$/.test(tokens[i])) {
						return tokens[i];
					  }
					}
				  }
				}

				return null;
			  }
		}
